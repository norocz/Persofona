{% extends "core/base.html" %}{% load i18n %}
{% block title %}{{ APP_NAME }} — {{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1 class="glitch" data-text="{{ title }}">{{ title }}</h1></div>
<div class="panel form-panel">
  <form method="post" class="form-matrix">{% csrf_token %}
    {% for field in form %}
    <div class="fg"><label>{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="field-err">{{ field.errors }}</div>{% endif %}</div>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn btn-p">{% trans "Uložit" %}</button>
      <a href="javascript:history.back()" class="btn btn-ghost">{% trans "Zrušit" %}</a>
    </div>
  </form>
</div>
{% endblock %}

{% extends "core/base.html" %}{% load i18n %}
{% block title %}{{ APP_NAME }} — {{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1 class="glitch" data-text="{{ title }}">{{ title }}</h1></div>
<div class="panel confirm-panel">
  <div class="confirm-icon">⚠</div>
  <p class="confirm-msg">{{ msg }}</p>
  <form method="post" class="confirm-actions">{% csrf_token %}
    <button type="submit" class="btn btn-d">{% trans "Smazat" %}</button>
    <a href="javascript:history.back()" class="btn btn-ghost">{% trans "Zrušit" %}</a>
  </form>
</div>
{% endblock %}
